<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial</title>
    <link rel="stylesheet" href="index02.css">
</head>
<body>
    <div class="container">
        <h1>Boas Vindas!</h1>
        <p>Vamos personalizar usando JavaScript!</p>
        <div class="salve" id="mensagem">Olá, visitante!</div>
        <button id="botao" onClick = "mudarNome()">Adicionar Nome</button>
    </div>

    <script>
        function mudarNome(){
            let nome = "lucas"
            document.getElementById("mensagem").textContent = "Olá, " + nome
        }
    </script>

</body>
</html>
